<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Now Playing</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #121212; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .player { min-height: 100%; max-width: 480px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 24px calc(env(safe-area-inset-bottom, 0px) + 28px);
      display: flex; flex-direction: column; justify-content: center; gap: 28px; }
    .header { text-align: center; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #b3b3b3; }
    .art { width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; object-fit: cover;
      background: linear-gradient(135deg, #2a2a2a, #181818); box-shadow: 0 16px 40px rgba(0,0,0,.6); }
    .meta h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .meta p { font-size: 15px; color: #b3b3b3; }
    .progress { display: flex; flex-direction: column; gap: 6px; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
      border-radius: 2px; outline: none; background: linear-gradient(to right, #fff 0%, #fff var(--p, 0%), #4d4d4d var(--p, 0%), #4d4d4d 100%); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
    input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; }
    .times { display: flex; justify-content: space-between; font-size: 12px; color: #b3b3b3; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 36px; }
    button { background: none; border: 0; color: #fff; cursor: pointer; font-family: inherit; }
    .side { font-size: 30px; line-height: 1; padding: 8px; }
    .play { width: 68px; height: 68px; border-radius: 50%; background: #fff; color: #121212; font-size: 28px;
      display: flex; align-items: center; justify-content: center; }
    button:active { transform: scale(.94); }
  </style>
</head>
<body>
  <main class="player">
    <div class="header">Playing from Your Library</div>

    <img class="art" alt="Album art"
      src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=900&q=80"
      onerror="this.removeAttribute('src')">

    <div class="meta">
      <h1>Midnight Drive</h1>
      <p>SoundHelix</p>
    </div>

    <div class="progress">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>

    <div class="controls">
      <button class="side" id="prev" aria-label="Previous">&#9198;&#xFE0E;</button>
      <button class="play" id="play" aria-label="Play/Pause">&#9654;&#xFE0E;</button>
      <button class="side" id="next" aria-label="Next">&#9197;&#xFE0E;</button>
    </div>

    <audio id="audio" preload="metadata" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
  </main>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const seek = document.getElementById('seek');
    const cur = document.getElementById('cur');
    const dur = document.getElementById('dur');

    const fmt = s => {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60), r = Math.floor(s % 60);
      return m + ':' + String(r).padStart(2, '0');
    };
    const paint = () => seek.style.setProperty('--p', seek.value + '%');

    playBtn.addEventListener('click', () => {
      if (audio.paused) audio.play().catch(console.error);
      else audio.pause();
    });
    audio.addEventListener('play',  () => playBtn.innerHTML = '&#9208;&#xFE0E;');
    audio.addEventListener('pause', () => playBtn.innerHTML = '&#9654;&#xFE0E;');
    audio.addEventListener('ended', () => { playBtn.innerHTML = '&#9654;&#xFE0E;'; });

    audio.addEventListener('loadedmetadata', () => dur.textContent = fmt(audio.duration));
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      seek.value = (audio.currentTime / audio.duration) * 100;
      cur.textContent = fmt(audio.currentTime);
      paint();
    });
    seek.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
      paint();
    });

    // Single-track demo: Previous/Next restart the song
    document.getElementById('prev').addEventListener('click', () => { audio.currentTime = 0; });
    document.getElementById('next').addEventListener('click', () => { audio.currentTime = 0; audio.play().catch(console.error); });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
    }
  </script>
</body>
</html>
